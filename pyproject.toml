[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awesome-ai-era-edu"
version = "1.0.0"
description = "A curated collection of outstanding papers in AI-era education"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "AI Era Education Team" }
]
keywords = ["ai", "education", "papers", "research", "classification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pandas>=1.5.0",
    "python-dotenv>=0.19.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/THU-/Awesome-AI-Era-Edu"
Repository = "https://github.com/your-username/Awesome-AI-Era-Edu"
Issues = "https://github.com/your-username/Awesome-AI-Era-Edu/issues"

[project.scripts]
classify-papers = "scripts.classify_papers:main"
update-readme = "scripts.update_readme:main"
incremental-update = "scripts.incremental_update:main"
sync-readme = "sync_readme:main"
arxiv-mcp-client = "scripts.arxiv_mcp_client:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"] 
